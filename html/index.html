<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Biblioteca Familiar de Steam</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loading-text">Cargando...</p>
    </div>

    <section id="screen-config" class="screen active">
        <div class="screen-container">
            <h1>Simulador de Biblioteca Familiar de Steam</h1>
            <div class="card">
                <p class="card-label">Ingresar API Key de Steam</p>
                <input type="text" id="api-key-input" class="input" placeholder="Tu API Key de Steam">
                <div class="card-actions">
                    <button id="api-key-btn" class="btn btn-primary">Aceptar</button>
                </div>
            </div>
        </div>
    </section>

    <section id="screen-home" class="screen">
        <header class="top-bar">
            <h1>Simulador de Biblioteca Familiar de Steam</h1>
            <div class="top-bar-actions">
                <button id="compare-nav-btn" class="btn btn-secondary">Comparar</button>
                <button id="new-library-btn" class="btn btn-primary">Nueva Biblioteca</button>
            </div>
        </header>
        <main class="content">
            <div id="library-list" class="library-list"></div>
        </main>
    </section>

    <section id="screen-library" class="screen">
        <header class="top-bar">
            <div class="library-header-info">
                <button id="back-home-btn" class="btn btn-back">&larr; Volver</button>
                <div>
                    <h2 id="library-title"></h2>
                    <p id="library-game-count"></p>
                </div>
                <div id="library-members" class="member-avatars"></div>
            </div>
            <button id="config-library-btn" class="btn btn-secondary">Configurar</button>
        </header>
        <div class="search-bar">
            <input type="text" id="game-search" class="input" placeholder="Buscar juego por nombre...">
        </div>
        <div class="library-content">
            <div id="game-grid" class="game-grid"></div>
            <aside id="stats-panel" class="stats-panel">
                <h3>Estadisticas</h3>
                <canvas id="pie-chart"></canvas>
                <div id="contribution-list"></div>
            </aside>
        </div>
    </section>

    <section id="screen-create" class="screen">
        <div class="screen-container">
            <h1 id="create-title">Nueva Biblioteca</h1>
            <div class="card">
                <label class="form-label">Titulo de la biblioteca</label>
                <input type="text" id="library-title-input" class="input" placeholder="Ej: Biblioteca Familiar">
                <label class="form-label">Integrantes:</label>
                <input type="text" id="library-members-input" class="input" placeholder="Steam64 IDs separados por ','">
                <p class="form-hint">ID numerico de Steam (17 digitos). Ej: 76561197960287930, 76561197960434622</p>
                <div id="member-preview" class="member-avatars" style="margin-top:12px;"></div>
                <div class="card-actions">
                    <button id="cancel-btn" class="btn btn-secondary">Cancelar</button>
                    <button id="accept-btn" class="btn btn-primary">Aceptar</button>
                </div>
            </div>
        </div>
    </section>

    <section id="screen-compare" class="screen">
        <header class="top-bar">
            <h1>Comparar Bibliotecas</h1>
            <button id="back-home-compare-btn" class="btn btn-back">&larr; Volver</button>
        </header>
        <div class="compare-controls">
            <label>Selecciona las bibliotecas a comparar (minimo 2):</label>
            <div id="compare-select" class="compare-select"></div>
            <button id="compare-btn" class="btn btn-primary">Comparar</button>
        </div>
        <div id="compare-results" class="compare-results"></div>
    </section>

    <script src="../lib/chart.umd.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/chart-config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
